<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>旅のしおり — 行程表</title>
<style>
  :root{ --bg:#f4f1ea; --card:#fff; --ink:#37352f; --muted:#8a8576; --line:#e3ddcf;
    --green:#dfe8d4; --yellow:#fbf0cf; --blue:#dce8f2; --accent:#1fb866; --red:#d0584a; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif; font-size:14px; }
  header{ position:sticky; top:0; z-index:5; background:#fff; border-bottom:1px solid var(--line);
    display:flex; gap:8px; align-items:center; padding:9px 12px; flex-wrap:wrap; }
  header h1{ font-size:15px; margin:0; }
  .navtoggle{ display:inline-flex; background:#fff; border:1px solid var(--line); border-radius:18px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,.1); }
  .navtoggle a{ text-decoration:none; color:var(--ink); font-size:12px; font-weight:800; padding:7px 13px; }
  .navtoggle a.active{ background:var(--accent); color:#fff; }
  select,input,textarea,button{ font-family:inherit; font-size:14px; color:var(--ink); }
  select#tripSel{ padding:6px 8px; border:1px solid var(--line); border-radius:8px; background:#fff; max-width:48vw; }
  .btn{ background:var(--bg); border:1px solid var(--line); border-radius:16px; padding:6px 11px; font-size:12px; font-weight:700; cursor:pointer; }
  .btn.add{ background:#eef6ea; border-color:#cfe6c5; color:#1a7a44; }
  .btn.del{ background:transparent; border:none; color:var(--red); font-weight:700; cursor:pointer; font-size:12px; }
  main{ max-width:760px; margin:0 auto; padding:12px; }
  .meta{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  .meta input.title{ flex:1; min-width:180px; font-size:17px; font-weight:800; border:none; background:transparent; padding:6px 2px; border-bottom:2px solid var(--line); }
  .meta input.date{ border:1px solid var(--line); border-radius:8px; padding:6px 8px; background:#fff; }
  .day{ background:var(--card); border:1px solid var(--line); border-radius:14px; margin-bottom:26px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,.07); }
  .day-banner{ background:#4f7a4f; color:#fff; padding:9px 13px; display:flex; align-items:center; gap:10px; }
  .day-no{ background:rgba(255,255,255,.22); border-radius:12px; padding:2px 11px; font-weight:800; font-size:12px; letter-spacing:.03em; white-space:nowrap; }
  .day-date{ font-weight:800; font-size:16px; white-space:nowrap; }
  .day-tag{ margin-left:auto; background:rgba(255,255,255,.22); border-radius:10px; padding:2px 9px; font-size:11px; font-weight:800; white-space:nowrap; }
  .day-head{ background:var(--green); padding:9px 12px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .day-head input.d-date{ border:1px solid #c6d6b8; border-radius:8px; padding:5px 8px; background:#fff; width:120px; }
  .day-head input.d-label{ flex:1; min-width:120px; border:none; background:transparent; font-weight:800; font-size:15px; padding:4px 2px; }
  .sec{ padding:8px 12px; }
  .sec h3{ font-size:11px; color:var(--muted); margin:8px 0 6px; letter-spacing:.04em; font-weight:800; }
  .leg{ border:1px solid var(--line); border-radius:10px; padding:9px; margin-bottom:8px; background:#fffdf8; }
  .leg .ln{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .leg .pill{ font-size:11px; font-weight:800; color:#fff; background:#9a8; border-radius:10px; padding:2px 7px; }
  .leg .pill.dep{ background:#5b8f5b; } .leg .pill.arr{ background:#c08a3e; }
  .leg input.stn{ flex:1; min-width:80px; border:none; border-bottom:1px solid var(--line); background:transparent; padding:4px 2px; font-weight:700; }
  .leg input.time{ width:64px; border:1px solid var(--line); border-radius:7px; padding:4px 6px; background:#fff; text-align:center; }
  .leg .arrow{ text-align:center; color:var(--muted); font-size:12px; margin:3px 0; }
  .row2{ display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .row2 .fld{ display:flex; align-items:center; gap:4px; background:var(--yellow); border-radius:8px; padding:3px 7px; }
  .row2 .fld label{ font-size:10px; color:#8a7a3a; font-weight:800; }
  .row2 .fld input{ border:none; background:transparent; min-width:70px; }
  .calc{ font-size:11px; color:var(--muted); margin-top:6px; }
  .calc b{ color:var(--ink); }
  .item{ border:1px solid var(--line); border-radius:10px; padding:8px; margin-bottom:8px; background:var(--blue); }
  .item .ln{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .item select.kind{ border:1px solid #b9cfe0; border-radius:8px; padding:4px 6px; background:#fff; font-weight:700; }
  .item input.nm{ flex:1; min-width:90px; border:none; border-bottom:1px solid #b9cfe0; background:transparent; padding:4px 2px; font-weight:700; }
  .item input.place,.item input.itime{ border:1px solid #b9cfe0; border-radius:7px; padding:4px 6px; background:#fff; }
  .item input.place{ min-width:90px; } .item input.itime{ width:64px; text-align:center; }
  textarea.memo{ width:100%; border:1px solid var(--line); border-radius:8px; padding:5px 7px; margin-top:6px; resize:vertical; min-height:30px; background:#fff; }
  .photos{ display:flex; gap:6px; flex-wrap:wrap; margin-top:7px; align-items:center; }
  .photos img{ width:54px; height:54px; object-fit:cover; border-radius:8px; border:1px solid var(--line); }
  .photos .ph-wrap{ position:relative; }
  .photos .ph-del{ position:absolute; top:-6px; right:-6px; background:var(--red); color:#fff; border:none; border-radius:50%; width:18px; height:18px; font-size:11px; cursor:pointer; line-height:1; }
  .photo-btn{ font-size:12px; }
  .foot{ display:flex; justify-content:space-between; align-items:center; margin-top:4px; }
  .empty{ color:var(--muted); text-align:center; padding:40px 12px; }
  .nomove-chk{ font-size:12px; display:flex; align-items:center; gap:4px; font-weight:700; color:#5b6b5b; cursor:pointer; white-space:nowrap; }
  .nomove{ color:var(--muted); font-weight:700; padding:6px 2px; }
  .ov-nomove{ color:var(--muted); font-weight:700; padding:6px 4px; white-space:nowrap; }
  /* 独立した行程サマリー領域 */
  .ov-area{ background:#fff; border:1px solid var(--line); border-radius:14px; margin-bottom:16px; padding-bottom:6px; box-shadow:0 1px 4px rgba(0,0,0,.04); overflow:hidden; }
  .ov-area .ttl{ font-size:11px; color:var(--muted); font-weight:800; padding:9px 12px 2px; letter-spacing:.05em; background:#fbfaf5; border-bottom:1px solid var(--line); }
  .ov-day{ border-top:1px solid #f1ede2; }
  .ov-day:first-of-type{ border-top:none; }
  .ov-day-lbl{ font-size:12px; font-weight:800; color:var(--ink); padding:8px 12px 0; }
  /* 横並びサマリー(1日の移動を一望) */
  .overview{ display:flex; align-items:stretch; overflow-x:auto; padding:6px 12px 10px; -webkit-overflow-scrolling:touch; }
  .ov-stn{ flex:0 0 auto; text-align:center; min-width:62px; padding:0 4px; display:flex; flex-direction:column; justify-content:center; }
  .ov-stn .nm{ font-weight:800; font-size:13px; white-space:nowrap; }
  .ov-stn .t{ font-size:11px; white-space:nowrap; line-height:1.5; }
  .ov-stn .arr{ color:#c08a3e; } .ov-stn .dep{ color:#3f7a3f; }
  .ov-stn .wait{ font-size:10px; color:#a23; background:#fbe3e3; border-radius:8px; padding:1px 6px; margin-top:3px; display:inline-block; white-space:nowrap; }
  .ov-leg{ flex:0 0 auto; align-self:center; text-align:center; color:var(--muted); font-size:10px; padding:0 4px; min-width:72px; }
  .ov-leg .tr{ font-weight:800; color:var(--ink); white-space:nowrap; font-size:11px; }
  .ov-leg .ar{ font-size:16px; color:#bbb; line-height:1; }
</style>
</head>
<body>
<header>
  <div class="navtoggle">
    <a href="../atlas/">🗺 地図</a>
    <a class="active">📖 しおり</a>
  </div>
  <select id="tripSel"></select>
  <button class="btn" id="newTrip">＋新規旅程</button>
  <button class="btn" id="saveBtn" style="margin-left:auto">💾 保存</button>
  <span id="saveStatus" style="font-size:11px;color:var(--muted)"></span>
</header>
<main id="main"></main>

<script>
// ===== 保存(IndexedDB) =====
function idb(){ return new Promise((res,rej)=>{ if(!window.indexedDB) return rej(); const o=indexedDB.open('shiori',1);
  o.onupgradeneeded=()=>{ if(!o.result.objectStoreNames.contains('kv')) o.result.createObjectStore('kv'); };
  o.onsuccess=()=>res(o.result); o.onerror=()=>rej(); }); }
async function idbSet(k,v){ try{ const db=await idb(); await new Promise(r=>{ const tx=db.transaction('kv','readwrite'); tx.objectStore('kv').put(v,k); tx.oncomplete=r; tx.onerror=r; }); }catch(e){} }
async function idbGet(k){ try{ const db=await idb(); return await new Promise(r=>{ const tx=db.transaction('kv','readonly'); const rq=tx.objectStore('kv').get(k); rq.onsuccess=()=>r(rq.result); rq.onerror=()=>r(null); }); }catch(e){ return null; } }

let trips=[], cur=0, saveT;
function setStatus(t){ const s=document.getElementById('saveStatus'); if(s) s.textContent=t; }
function save(){ setStatus('保存中…'); clearTimeout(saveT); saveT=setTimeout(async()=>{ await idbSet('trips',trips); setStatus('✓ 保存済み'); },250); }
function uid(){ return Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36); }

function newLeg(){ return {fromStn:'',depTime:'',toStn:'',arrTime:'',train:'',seat:'',memo:'',photos:[]}; }
function newItem(k){ return {kind:k||'食事',name:'',place:'',time:'',memo:'',photos:[]}; }
function newDay(){ return {date:'',label:'',noTravel:false,legs:[],items:[]}; }
function nextDate(ymd){ if(!/^\d{4}-\d{2}-\d{2}$/.test(ymd||'')) return ''; const d=new Date(ymd+'T00:00:00'); d.setDate(d.getDate()+1); const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function fmtJDate(ymd){ if(!/^\d{4}-\d{2}-\d{2}$/.test(ymd||'')) return ''; const d=new Date(ymd+'T00:00:00'); const w='日月火水木金土'[d.getDay()]; return (d.getMonth()+1)+'月'+d.getDate()+'日('+w+')'; }
// di より前で「最後に到着した駅」を返す(発駅の自動補完用)
function prevArrival(t,di){ for(let i=Math.min(di,t.days.length)-1;i>=0;i--){ const lg=t.days[i].legs; if(lg&&lg.length) return lg[lg.length-1].toStn||''; } return ''; }
function newTrip(){ return {id:uid(),title:'新しい旅程',start:'',end:'',days:[newDay()]}; }

// ===== 時間計算 =====
function toMin(t){ const m=/^(\d{1,2}):(\d{2})$/.exec((t||'').trim()); return m? (+m[1])*60+(+m[2]) : null; }
function fmtDur(min){ if(min==null||min<0) return '—'; const h=Math.floor(min/60),mm=min%60; return (h?h+'時間':'')+(mm+'分'); }

const g=id=>document.getElementById(id);
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

const KINDS=['食事','宿泊','観光','寄り道','その他'];

function renderShell(){
  const sel=g('tripSel'); sel.innerHTML='';
  trips.forEach((t,i)=>{ const o=document.createElement('option'); o.value=i; o.textContent=t.title||('旅程'+(i+1)); sel.appendChild(o); });
  sel.value=cur;
}

function photosHTML(path){
  const t=trips[cur]; const arr=getByPath(path).photos||[];
  let h='<div class="photos">';
  arr.forEach((src,pi)=> h+=`<span class="ph-wrap"><img src="${src}"><button class="ph-del" data-act="delphoto" data-path="${path}" data-pi="${pi}">×</button></span>`);
  h+=`<label class="btn photo-btn">📷 写真<input type="file" accept="image/*" capture="environment" style="display:none" data-act="addphoto" data-path="${path}"></label></div>`;
  return h;
}

// 入力から1日の移動サマリー(横並び)を生成
function overviewHTML(d){
  if(d.noTravel) return '<div class="overview"><div class="ov-nomove">🛏 移動なし</div></div>';
  if(!d.legs.length) return '';
  const seq=[];
  d.legs.forEach(lg=>{
    const last=seq[seq.length-1];
    if(last && last.type==='stn' && last.name===(lg.fromStn||'?') && !last.dep){ last.dep=lg.depTime; }
    else seq.push({type:'stn',name:lg.fromStn||'?',arr:'',dep:lg.depTime});
    const ride=(toMin(lg.arrTime)!=null&&toMin(lg.depTime)!=null)?fmtDur(toMin(lg.arrTime)-toMin(lg.depTime)):'';
    seq.push({type:'leg',train:lg.train,ride});
    seq.push({type:'stn',name:lg.toStn||'?',arr:lg.arrTime,dep:''});
  });
  let h='<div class="overview">';
  seq.forEach(n=>{
    if(n.type==='leg'){ h+=`<div class="ov-leg"><div class="ar">→</div>${n.train?`<div class="tr">${esc(n.train)}</div>`:''}${n.ride?`<div>${esc(n.ride)}</div>`:''}</div>`; }
    else { const wait=(toMin(n.dep)!=null&&toMin(n.arr)!=null)?fmtDur(toMin(n.dep)-toMin(n.arr)):'';
      h+=`<div class="ov-stn"><div class="nm">${esc(n.name)}</div>`+
         (n.arr?`<div class="t arr">着 ${esc(n.arr)}</div>`:'')+
         (n.dep?`<div class="t dep">発 ${esc(n.dep)}</div>`:'')+
         (wait?`<div class="wait">⏳${wait}</div>`:'')+`</div>`; }
  });
  return h+'</div>';
}

function render(){
  const t=trips[cur];
  if(!t){ g('main').innerHTML='<div class="empty">旅程がありません。「＋新規旅程」で作成してください。</div>'; return; }
  let h='';
  h+=`<div class="meta">
    <input class="title" data-f="title" value="${esc(t.title)}" placeholder="旅程のタイトル">
    <input class="date" type="date" data-f="start" value="${esc(t.start)}">
    <span style="color:var(--muted)">〜</span>
    <input class="date" type="date" data-f="end" value="${esc(t.end)}">
    <button class="btn del" data-act="deltrip">旅程を削除</button>
  </div>`;
  // 独立した行程サマリー領域(タイトルと入力エリアの間)
  h+=`<div class="ov-area"><div class="ttl">🚃 行程サマリー</div>`;
  t.days.forEach((d,di)=>{ const dl=`Day ${di+1}${fmtJDate(d.date)?' · '+fmtJDate(d.date):''}${d.label?'　'+d.label:''}`;
    h+=`<div class="ov-day"><div class="ov-day-lbl">${esc(dl)}</div><div id="ov-${di}">${overviewHTML(d)}</div></div>`; });
  h+=`</div>`;
  // 入力エリア
  t.days.forEach((d,di)=>{
    h+=`<div class="day">
      <div class="day-banner"><span class="day-no">Day ${di+1}</span><span class="day-date">${esc(fmtJDate(d.date)||'日付未設定')}</span>${d.noTravel?'<span class="day-tag">🛏 移動なし</span>':''}</div>
      <div class="day-head">
      <input class="d-date" type="date" data-d="${di}" data-f="date" value="${esc(d.date)}">
      <input class="d-label" data-d="${di}" data-f="label" value="${esc(d.label)}" placeholder="例：品川→嵐山">
      <label class="nomove-chk"><input type="checkbox" data-d="${di}" data-f="noTravel" ${d.noTravel?'checked':''}>移動なし</label>
      <button class="btn del" data-act="delday" data-d="${di}">日を削除</button>
    </div>`;
    // legs
    if(d.noTravel){ h+=`<div class="sec"><div class="nomove">🛏 この日は移動なし</div></div>`; }
    else {
    h+=`<div class="sec"><h3>区間（鉄道）</h3>`;
    d.legs.forEach((lg,li)=>{
      const ride=fmtDur((toMin(lg.arrTime)!=null&&toMin(lg.depTime)!=null)?toMin(lg.arrTime)-toMin(lg.depTime):null);
      const prev=d.legs[li-1];
      const wait=(prev&&toMin(lg.depTime)!=null&&toMin(prev.arrTime)!=null)?fmtDur(toMin(lg.depTime)-toMin(prev.arrTime)):'—';
      h+=`<div class="leg">
        <div class="ln"><span class="pill dep">発</span>
          <input class="stn" data-d="${di}" data-l="${li}" data-f="fromStn" value="${esc(lg.fromStn)}" placeholder="発駅">
          <input class="time" data-d="${di}" data-l="${li}" data-f="depTime" value="${esc(lg.depTime)}" placeholder="9:00"></div>
        <div class="arrow">↓</div>
        <div class="ln"><span class="pill arr">着</span>
          <input class="stn" data-d="${di}" data-l="${li}" data-f="toStn" value="${esc(lg.toStn)}" placeholder="着駅">
          <input class="time" data-d="${di}" data-l="${li}" data-f="arrTime" value="${esc(lg.arrTime)}" placeholder="10:23"></div>
        <div class="row2">
          <span class="fld"><label>列車</label><input data-d="${di}" data-l="${li}" data-f="train" value="${esc(lg.train)}" placeholder="のぞみ15号"></span>
          <span class="fld"><label>号車・席</label><input data-d="${di}" data-l="${li}" data-f="seat" value="${esc(lg.seat)}" placeholder="8号車3-CD"></span>
        </div>
        <div class="calc">乗車 <b>${ride}</b> ／ 前区間からの待ち <b>${wait}</b></div>
        <textarea class="memo" data-d="${di}" data-l="${li}" data-f="memo" placeholder="メモ">${esc(lg.memo)}</textarea>
        ${photosHTML(`${di}.legs.${li}`)}
        <div class="foot"><span></span><button class="btn del" data-act="delleg" data-d="${di}" data-l="${li}">区間を削除</button></div>
      </div>`;
    });
    h+=`<button class="btn add" data-act="addleg" data-d="${di}">＋区間を追加</button></div>`;
    }
    // items
    h+=`<div class="sec"><h3>観光・食事・宿泊など</h3>`;
    d.items.forEach((it,ii)=>{
      h+=`<div class="item">
        <div class="ln">
          <select class="kind" data-d="${di}" data-i="${ii}" data-f="kind">${KINDS.map(k=>`<option ${k===it.kind?'selected':''}>${k}</option>`).join('')}</select>
          <input class="nm" data-d="${di}" data-i="${ii}" data-f="name" value="${esc(it.name)}" placeholder="名称（例：Agri）">
          <input class="itime" data-d="${di}" data-i="${ii}" data-f="time" value="${esc(it.time)}" placeholder="19:30">
        </div>
        <div class="row2" style="margin-top:6px"><input class="place" data-d="${di}" data-i="${ii}" data-f="place" value="${esc(it.place)}" placeholder="場所（市役所前 など）"></div>
        <textarea class="memo" data-d="${di}" data-i="${ii}" data-f="memo" placeholder="メモ">${esc(it.memo)}</textarea>
        ${photosHTML(`${di}.items.${ii}`)}
        <div class="foot"><span></span><button class="btn del" data-act="delitem" data-d="${di}" data-i="${ii}">削除</button></div>
      </div>`;
    });
    h+=`<button class="btn add" data-act="additem" data-d="${di}">＋予定を追加</button></div>`;
    h+=`</div>`;
  });
  h+=`<button class="btn add" data-act="addday" style="width:100%;padding:10px">＋日を追加</button>`;
  g('main').innerHTML=h;
}

function getByPath(path){ const [di,coll,idx]=path.split('.'); return trips[cur].days[+di][coll][+idx]; }

// ===== 入力(値の保存。再描画せずフォーカス維持) =====
function fieldTarget(el){ const t=trips[cur], d=el.dataset; if(d.l!=null) return t.days[+d.d].legs[+d.l];
  if(d.i!=null) return t.days[+d.d].items[+d.i]; if(d.d!=null) return t.days[+d.d]; return t; }
g('main').addEventListener('input', e=>{ const el=e.target; if(!el.dataset||!el.dataset.f) return;
  if(el.type==='checkbox') return;   // チェックボックスはchangeで処理
  fieldTarget(el)[el.dataset.f]=el.value;
  if(el.dataset.f==='title') renderShell();
  if(el.dataset.d!=null){ const w=document.getElementById('ov-'+el.dataset.d); if(w) w.innerHTML=overviewHTML(trips[cur].days[+el.dataset.d]); }  // 入力中も横並びを即時更新
  save(); });
// blur(change)で計算欄を更新するため再描画
g('main').addEventListener('change', e=>{ const el=e.target;
  if(el.dataset&&el.dataset.act==='addphoto'){ handleAddPhoto(el); return; }
  if(el.type==='checkbox' && el.dataset.f){ fieldTarget(el)[el.dataset.f]=el.checked; save(); render(); return; }   // 移動なし切替
  if(el.dataset&&el.dataset.f){ render(); } });   // 入力確定で横並びサマリーも更新

// ===== クリック(追加・削除) =====
g('main').addEventListener('click', e=>{ const el=e.target.closest('[data-act]'); if(!el) return; const a=el.dataset.act, t=trips[cur];
  const di=+el.dataset.d;
  if(a==='addday'){ const last=t.days[t.days.length-1]; const nd=newDay(); nd.date=nextDate(last&&last.date);
    const lg=newLeg(); lg.fromStn=prevArrival(t,t.days.length); nd.legs.push(lg); t.days.push(nd); }
  else if(a==='delday'){ if(confirm('この日を削除しますか？')) t.days.splice(di,1); else return; }
  else if(a==='addleg'){ const day=t.days[di]; const lg=newLeg();
    lg.fromStn = day.legs.length ? (day.legs[day.legs.length-1].toStn||'') : prevArrival(t,di); day.legs.push(lg); }
  else if(a==='delleg'){ t.days[di].legs.splice(+el.dataset.l,1); }
  else if(a==='additem'){ t.days[di].items.push(newItem()); }
  else if(a==='delitem'){ t.days[di].items.splice(+el.dataset.i,1); }
  else if(a==='deltrip'){ if(!confirm('この旅程を丸ごと削除しますか？')) return; trips.splice(cur,1); if(!trips.length) trips.push(newTrip()); cur=Math.max(0,cur-1); renderShell(); }
  else if(a==='delphoto'){ const o=getByPath(el.dataset.path); o.photos.splice(+el.dataset.pi,1); }
  else return;
  save(); render();
});

// ===== 写真(縮小して保存) =====
function readImage(file, cb){ const r=new FileReader(); r.onload=()=>{ const img=new Image(); img.onload=()=>{
  const max=1280; let w=img.width,h=img.height; if(w>h&&w>max){h=h*max/w;w=max;} else if(h>max){w=w*max/h;h=max;}
  const c=document.createElement('canvas'); c.width=w;c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); cb(c.toDataURL('image/jpeg',0.8)); }; img.src=r.result; }; r.readAsDataURL(file); }
function handleAddPhoto(el){ const f=el.files&&el.files[0]; if(!f) return; readImage(f, url=>{ const o=getByPath(el.dataset.path); (o.photos=o.photos||[]).push(url); save(); render(); }); }

g('tripSel').addEventListener('change', e=>{ cur=+e.target.value; render(); });
g('newTrip').addEventListener('click', ()=>{ trips.push(newTrip()); cur=trips.length-1; renderShell(); render(); save(); });
g('saveBtn').addEventListener('click', async()=>{ setStatus('保存中…'); await idbSet('trips',trips); setStatus('✓ 保存しました'); });

(async function boot(){
  const saved=await idbGet('trips');
  trips = (Array.isArray(saved)&&saved.length)? saved : [newTrip()];
  cur=0; renderShell(); render();
})();
</script>
