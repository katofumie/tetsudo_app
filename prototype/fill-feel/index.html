<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>乗りつぶし — 手触り感プロトタイプ</title>
<style>
  :root {
    --bg: #0f1320;
    --panel: #1a2032;
    --ink: #e8ecf6;
    --muted: #8a93ab;
    --rail-off: #39415a;
    --accent: #ff5a3c;     /* 塗りつぶし色 */
    --accent2: #ffd23c;
    --get: #46d39a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif;
    overscroll-behavior: none; user-select: none; -webkit-user-select: none; }
  header { padding: 14px 16px 10px; }
  h1 { font-size: 16px; margin: 0 0 10px; letter-spacing: .04em; }
  .stats { display: flex; gap: 10px; }
  .stat { flex: 1; background: var(--panel); border-radius: 14px; padding: 10px 12px; }
  .stat .label { font-size: 11px; color: var(--muted); }
  .stat .val { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .val small { font-size: 12px; color: var(--muted); font-weight: 500; }
  .rate { position: relative; overflow: hidden; }
  .rate .bar { position:absolute; left:0; bottom:0; height:4px; background:var(--accent);
    width:0%; transition: width .5s cubic-bezier(.2,.8,.2,1); }
  .pop { animation: pop .35s ease; }
  @keyframes pop { 0%{transform:scale(1)} 40%{transform:scale(1.18); color:var(--accent2)} 100%{transform:scale(1)} }
  main { padding: 0 8px; }
  svg { width: 100%; height: auto; touch-action: none; display:block; }
  .seg-hit { stroke: transparent; stroke-width: 22; fill: none; cursor: pointer; }
  .seg { stroke: var(--rail-off); stroke-width: 6; fill: none; stroke-linecap: round;
    transition: stroke .45s ease, stroke-width .25s ease; }
  .seg.on { stroke: var(--accent); stroke-width: 8; }
  .seg.flash { animation: segflash .5s ease; }
  @keyframes segflash { 0%{stroke-width:16; stroke:var(--accent2)} 100%{stroke-width:8} }
  .stn { fill: var(--bg); stroke: var(--rail-off); stroke-width: 3; cursor: pointer; transition: all .25s ease; }
  .stn.pass  { fill: var(--muted); stroke: var(--muted); }                 /* 通過 */
  .stn.off   { fill: var(--get); stroke: var(--get); }                     /* 下車 */
  .stn.stay  { fill: var(--accent2); stroke: var(--accent2); }             /* 泊まった */
  .stn.bump  { animation: bump .3s ease; }
  @keyframes bump { 0%{transform:scale(1)} 50%{transform:scale(1.6)} 100%{transform:scale(1)} }
  .stn-ring { fill:none; stroke:var(--accent2); stroke-width:2.5; opacity:0; transition:opacity .25s; }
  .stn-ring.show { opacity:1; }
  .lbl { fill: var(--muted); font-size: 11px; pointer-events: none; }
  footer { padding: 10px 16px 22px; color: var(--muted); font-size: 12px; line-height: 1.6; }
  .legend { display:flex; gap:14px; flex-wrap:wrap; margin-bottom:8px; }
  .legend span { display:inline-flex; align-items:center; gap:6px; }
  .dot { width:11px; height:11px; border-radius:50%; display:inline-block; }
  .toast { position: fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
    background:var(--accent); color:#1a0e08; font-weight:700; padding:10px 18px; border-radius:30px;
    opacity:0; transition:all .3s; pointer-events:none; font-size:13px; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  .hint { text-align:center; color:var(--muted); font-size:12px; margin:4px 0 10px; }
</style>
</head>
<body>
<header>
  <h1>🚆 乗りつぶし — 手触り感プロトタイプ</h1>
  <div class="stats">
    <div class="stat rate">
      <div class="label">乗りつぶし率</div>
      <div class="val" id="rate">0<small>%</small></div>
      <div class="bar" id="bar"></div>
    </div>
    <div class="stat">
      <div class="label">区間</div>
      <div class="val"><span id="segCount">0</span><small>/<span id="segTotal">0</span></small></div>
    </div>
    <div class="stat">
      <div class="label">距離</div>
      <div class="val"><span id="km">0</span><small>km</small></div>
    </div>
    <div class="stat">
      <div class="label">駅</div>
      <div class="val"><span id="stnCount">0</span><small>/<span id="stnTotal">0</span></small></div>
    </div>
  </div>
</header>

<p class="hint">区間を<b>タップ／なぞって</b>塗る・駅を<b>タップ</b>で 通過→下車→泊まった</p>
<div style="text-align:center; margin:0 12px 10px;">
  <button id="vibtest" style="background:var(--panel); color:var(--ink); border:1px solid var(--rail-off);
    border-radius:20px; padding:8px 16px; font-size:13px; font-weight:600;">🔔 バイブをテスト</button>
  <div id="vibstatus" style="font-size:11px; color:var(--muted); margin-top:6px;"></div>
</div>

<main>
  <svg id="map" viewBox="0 0 360 460" preserveAspectRatio="xMidYMid meet"></svg>
</main>

<footer>
  <div class="legend">
    <span><i class="dot" style="background:var(--accent)"></i>乗車済</span>
    <span><i class="dot" style="background:var(--muted)"></i>通過</span>
    <span><i class="dot" style="background:var(--get)"></i>下車</span>
    <span><i class="dot" style="background:var(--accent2)"></i>泊まった</span>
  </div>
  ※ 路線は感触確認用の模式図（実データではありません）。塗る瞬間の手触り・カウンタの動き・触覚バイブ（対応端末）を確かめるためのものです。
</footer>

<div class="toast" id="toast"></div>

<script>
// ---- サンプルの模式ネットワーク（駅と区間） ----
const stations = [
  {id:'a', name:'みなと',   x:60,  y:60},
  {id:'b', name:'なかまち', x:160, y:60},
  {id:'c', name:'ひがし',   x:280, y:80},
  {id:'d', name:'やま',     x:60,  y:160},
  {id:'e', name:'ちゅうおう',x:160, y:160},
  {id:'f', name:'もり',     x:280, y:180},
  {id:'g', name:'かわ',     x:110, y:250},
  {id:'h', name:'みなみ',   x:210, y:250},
  {id:'i', name:'うみべ',   x:60,  y:340},
  {id:'j', name:'のはら',   x:160, y:340},
  {id:'k', name:'おか',     x:280, y:330},
  {id:'l', name:'さと',     x:160, y:420},
];
const segs = [
  ['a','b',12],['b','c',18],
  ['a','d',9],['b','e',9],['c','f',11],
  ['d','e',12],['e','f',16],
  ['d','g',13],['e','h',12],['f','k',14],
  ['g','h',11],['h','k',18],
  ['g','i',12],['h','j',11],
  ['i','j',12],['j','k',20],
  ['j','l',9],
];

const S = Object.fromEntries(stations.map(s=>[s.id,s]));
const svg = document.getElementById('map');
const NS='http://www.w3.org/2000/svg';
const el=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};

const totalKm = segs.reduce((s,x)=>s+x[2],0);
const segState = segs.map(()=>false);
const stnState = {}; stations.forEach(s=>stnState[s.id]=0); // 0未,1通過,2下車,3泊
const order=['', 'pass','off','stay'];

document.getElementById('segTotal').textContent = segs.length;
document.getElementById('stnTotal').textContent = stations.length;

const supportsVibrate = ('vibrate' in navigator) || ('mozVibrate' in navigator);
function vibrate(pattern){
  if(!navigator.vibrate) return false;
  try { return navigator.vibrate(pattern); } catch(e){ return false; }
}

// 振動サポート状況の表示と切り分けヒント
(function(){
  const st = document.getElementById('vibstatus');
  const secure = window.isSecureContext;
  const proto = location.protocol; // file: / http: / https:
  let msg;
  if(!supportsVibrate){
    msg = '⚠️ この端末/ブラウザは振動APIに非対応（iPhoneのSafari・PCは鳴りません）。本番のFlutterアプリではネイティブ触覚で鳴ります。';
  } else {
    msg = '✓ 振動API対応。鳴らない時は: マナーモード/省電力を解除、'
        + (proto==='file:' ? 'file:// で開いているため一部ブラウザで無効（http配信推奨）、' : '')
        + 'ブラウザの振動許可を確認。';
  }
  st.textContent = msg;
})();

document.getElementById('vibtest').addEventListener('click', ()=>{
  const ok = vibrate([40, 60, 120]); // 長め＆パターンで体感しやすく
  const st = document.getElementById('vibstatus');
  if(!supportsVibrate){
    st.textContent = '⚠️ 非対応端末のため振動できません（iPhone/PCなど）。';
  } else if(ok===false){
    st.textContent = '△ 呼び出しはブロックされました（マナーモード/file:///権限を確認）。';
  } else {
    st.textContent = '🔔 振動を送信しました。感じない場合はマナーモード/省電力を確認してください。';
  }
});

function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1100);
}

function refresh(milestone){
  const n=segState.filter(Boolean).length;
  const km=segs.reduce((s,x,i)=>s+(segState[i]?x[2]:0),0);
  const rate=Math.round(n/segs.length*100);
  const stn=Object.values(stnState).filter(v=>v>0).length;
  const rateEl=document.getElementById('rate');
  rateEl.innerHTML=rate+'<small>%</small>';
  document.getElementById('bar').style.width=rate+'%';
  document.getElementById('segCount').textContent=n;
  document.getElementById('km').textContent=km;
  document.getElementById('stnCount').textContent=stn;
  rateEl.classList.remove('pop'); void rateEl.offsetWidth; rateEl.classList.add('pop');
  if(milestone && rate>0 && rate%25===0) toast('🎉 '+rate+'% 達成！');
}

// 区間を描く（当たり判定の太い透明線 + 見える線）
const segNodes=[];
segs.forEach((sg,i)=>{
  const a=S[sg[0]], b=S[sg[1]];
  const line=el('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,class:'seg'});
  const hit =el('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,class:'seg-hit','data-seg':i});
  svg.appendChild(line); svg.appendChild(hit);
  segNodes.push(line);
});

function fillSeg(i, on){
  if(segState[i]===on) return false;
  segState[i]=on;
  const node=segNodes[i];
  node.classList.toggle('on',on);
  if(on){ node.classList.remove('flash'); void node.offsetWidth; node.classList.add('flash'); vibrate(35); }
  else vibrate(18);
  refresh(on);
  return true;
}

// 駅を描く
stations.forEach(s=>{
  const ring=el('circle',{cx:s.x,cy:s.y,r:11,class:'stn-ring','data-ring':s.id});
  const c=el('circle',{cx:s.x,cy:s.y,r:7,class:'stn','data-stn':s.id});
  const lbl=el('text',{x:s.x, y:s.y-13, 'text-anchor':'middle', class:'lbl'}); lbl.textContent=s.name;
  svg.appendChild(ring); svg.appendChild(c); svg.appendChild(lbl);
});

function cycleStn(id){
  stnState[id]=(stnState[id]+1)%4;
  const c=svg.querySelector(`[data-stn="${id}"]`);
  const ring=svg.querySelector(`[data-ring="${id}"]`);
  c.classList.remove('pass','off','stay');
  if(order[stnState[id]]) c.classList.add(order[stnState[id]]);
  ring.classList.toggle('show', stnState[id]===3);
  c.classList.remove('bump'); void c.offsetWidth; c.classList.add('bump');
  vibrate(stnState[id]===3 ? [25,40,25] : (stnState[id]===0?15:30));
  const names=['未訪問','通過','下車','泊まった'];
  toast(S[id].name+'：'+names[stnState[id]]);
  refresh(false);
}

// ---- 入力（タップ＆ドラッグでなぞり塗り） ----
let painting=false, paintMode=true;
function segAt(target){
  if(target && target.getAttribute && target.hasAttribute('data-seg')) return +target.getAttribute('data-seg');
  return -1;
}
svg.addEventListener('pointerdown', e=>{
  const stn=e.target.getAttribute && e.target.getAttribute('data-stn');
  if(stn){ cycleStn(stn); return; }
  const i=segAt(e.target);
  if(i>=0){ painting=true; paintMode=!segState[i]; fillSeg(i,paintMode); svg.setPointerCapture(e.pointerId); }
});
svg.addEventListener('pointermove', e=>{
  if(!painting) return;
  const t=document.elementFromPoint(e.clientX,e.clientY);
  const i=segAt(t);
  if(i>=0) fillSeg(i,paintMode);
});
const endPaint=()=>{ painting=false; };
svg.addEventListener('pointerup', endPaint);
svg.addEventListener('pointercancel', endPaint);

refresh(false);
</script>
</body>
</html>
