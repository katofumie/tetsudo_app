<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>乗りつぶしアトラス — プロトタイプ</title>
<style>
  :root{
    --bg:#e8eef0; --paper:#f3f6f7;
    --off:#9aa7b4; --on:#1fb866; --on2:#16a05a;
    --pass:#9aa7b4; --get:#1fb866; --stay:#f5a623;
    --ink:#37454f; --muted:#7b8794; --accent:#ff5a3c;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; overflow:hidden; background:var(--bg);
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif; color:var(--ink); }
  #wrap{ position:absolute; inset:0; }
  svg{ width:100%; height:100%; display:block; background:var(--paper); touch-action:none; }
  .seg{ fill:none; stroke:var(--off); stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round;
    vector-effect:non-scaling-stroke; pointer-events:none; transition:stroke .4s ease; }
  .seg.on{ stroke:var(--on); stroke-width:4; }
  .hit{ fill:none; stroke:transparent; stroke-width:18; vector-effect:non-scaling-stroke;
    stroke-linecap:round; pointer-events:stroke; cursor:pointer; }
  .stn{ fill:#fff; stroke:#5b6b7a; stroke-width:1.6; vector-effect:non-scaling-stroke; cursor:pointer; }
  .stn.pass{ fill:var(--pass); stroke:var(--pass); }
  .stn.off{ fill:var(--get); stroke:var(--on2); }
  .stn.stay{ fill:var(--stay); stroke:#c77f10; }
  .lbl{ fill:var(--ink); pointer-events:none; paint-order:stroke; stroke:var(--paper); stroke-width:3px;
    stroke-linejoin:round; font-weight:600; }
  .hud{ position:absolute; top:10px; left:10px; right:10px; z-index:2; display:flex; gap:8px;
    background:rgba(255,255,255,.86); border-radius:14px; padding:9px 10px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
  .hud .cell{ flex:1; text-align:center; } .hud .label{ font-size:10px; color:var(--muted); }
  .hud .val{ font-size:18px; font-weight:800; font-variant-numeric:tabular-nums; }
  .hud .val small{ font-size:11px; color:var(--muted); font-weight:600; }
  .bar{ position:absolute; left:0; bottom:0; height:3px; background:var(--on); width:0%; border-radius:2px; transition:width .5s cubic-bezier(.2,.8,.2,1); }
  .pop{ animation:pop .35s ease; } @keyframes pop{ 0%{transform:scale(1)} 40%{transform:scale(1.2); color:var(--on)} 100%{transform:scale(1)} }
  .panel{ position:absolute; left:10px; right:10px; bottom:10px; z-index:2;
    background:rgba(255,255,255,.9); border-radius:14px; padding:9px 11px; box-shadow:0 2px 10px rgba(0,0,0,.08); font-size:12px; }
  .panel .row{ display:flex; gap:8px; align-items:center; }
  .panel button,.fake{ background:#f3f6f7; color:var(--ink); border:1px solid #cdd6dd; border-radius:18px; padding:7px 12px; font-size:12px; font-weight:700; cursor:pointer; }
  .legend{ display:flex; gap:12px; flex-wrap:wrap; margin-top:7px; color:var(--muted); }
  .legend i{ width:10px; height:10px; border-radius:50%; display:inline-block; vertical-align:middle; margin-right:4px; }
  .hint{ color:var(--muted); margin-top:6px; line-height:1.5; }
  .toast{ position:absolute; left:50%; bottom:96px; transform:translateX(-50%) translateY(15px); z-index:3;
    background:var(--on); color:#fff; font-weight:700; padding:8px 16px; border-radius:24px; font-size:13px; opacity:0; transition:all .3s; pointer-events:none; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .drop{ position:absolute; inset:0; z-index:5; display:none; align-items:center; justify-content:center;
    background:rgba(31,184,102,.15); border:3px dashed var(--on); color:var(--on2); font-size:18px; font-weight:800; }
  .drop.show{ display:flex; }
</style>
</head>
<body>
<div id="wrap">
  <svg id="svg" xmlns="http://www.w3.org/2000/svg">
    <g id="gHit"></g><g id="gSeg"></g><g id="gStn"></g><g id="gLbl"></g>
  </svg>
</div>

<div class="hud">
  <div class="cell"><div class="label">乗りつぶし率</div><div class="val" id="rate">0<small>%</small></div></div>
  <div class="cell"><div class="label">区間</div><div class="val"><span id="segN">0</span><small>/<span id="segT">0</span></small></div></div>
  <div class="cell"><div class="label">距離</div><div class="val"><span id="km">0</span><small>km</small></div></div>
  <div class="cell"><div class="label">駅</div><div class="val"><span id="stnN">0</span><small>/<span id="stnT">0</span></small></div></div>
  <div class="bar" id="bar"></div>
</div>

<div class="panel">
  <div class="row">
    <b>🚆 乗りつぶしアトラス</b>
    <button id="reset">リセット</button>
    <button id="fit">全体表示</button>
    <label class="fake" style="margin-left:auto;">📁 GeoJSON読込
      <input id="file" type="file" accept=".geojson,.json,application/geo+json" style="display:none"></label>
  </div>
  <div class="legend">
    <span><i style="background:var(--on)"></i>乗車済</span>
    <span><i style="background:var(--pass)"></i>通過</span>
    <span><i style="background:var(--get)"></i>下車</span>
    <span><i style="background:var(--stay)"></i>泊まった</span>
  </div>
  <div class="hint">線をタップで塗る／駅をタップで 通過→下車→泊まった。ドラッグで移動・ピンチ/ホイールで拡大縮小。
    路線GeoJSONをドロップで実データ表示。※サンプルは概略座標。</div>
</div>

<div class="toast" id="toast"></div>
<div class="drop" id="drop">路線GeoJSONをドロップ</div>

<script>
// ===== サンプル路線（概略座標・体感用）。引くと網に見えるよう放射状に配置 =====
const LINES = [
  { name:'山手線', loop:true, stations:[
    ['東京',35.681,139.767],['神田',35.692,139.771],['秋葉原',35.698,139.773],['御徒町',35.707,139.774],
    ['上野',35.714,139.777],['鶯谷',35.721,139.778],['日暮里',35.728,139.771],['西日暮里',35.732,139.767],
    ['田端',35.738,139.761],['駒込',35.736,139.748],['巣鴨',35.733,139.739],['大塚',35.731,139.728],
    ['池袋',35.729,139.711],['目白',35.721,139.706],['高田馬場',35.712,139.703],['新大久保',35.701,139.700],
    ['新宿',35.690,139.700],['代々木',35.683,139.702],['原宿',35.670,139.702],['渋谷',35.658,139.701],
    ['恵比寿',35.646,139.710],['目黒',35.633,139.715],['五反田',35.626,139.723],['大崎',35.619,139.728],
    ['品川',35.628,139.738],['田町',35.645,139.747],['浜松町',35.655,139.756],['新橋',35.666,139.758],['有楽町',35.675,139.763] ] },
  { name:'中央線', stations:[
    ['東京',35.681,139.767],['御茶ノ水',35.699,139.765],['四ツ谷',35.686,139.730],['新宿',35.690,139.700],
    ['中野',35.706,139.666],['高円寺',35.705,139.650],['阿佐ケ谷',35.705,139.636],['荻窪',35.704,139.620],
    ['吉祥寺',35.703,139.580],['三鷹',35.702,139.560] ] },
  { name:'北方面', stations:[
    ['田端',35.738,139.761],['赤羽',35.778,139.721],['川口',35.807,139.724],['浦和',35.858,139.657],['大宮',35.906,139.624] ] },
  { name:'南方面', stations:[
    ['品川',35.628,139.738],['川崎',35.531,139.697],['横浜',35.466,139.622] ] },
];

const LAT0=35.7, KX=Math.cos(LAT0*Math.PI/180);
const px=(lng,lat)=>[ lng*KX, -lat ];           // 簡易正距円筒投影（ユーザー座標=度）
const svg=document.getElementById('svg');
const gHit=document.getElementById('gHit'), gSeg=document.getElementById('gSeg'),
      gStn=document.getElementById('gStn'), gLbl=document.getElementById('gLbl');
const NS='http://www.w3.org/2000/svg';
const mk=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
function hav(a,b){ const R=6371,r=x=>x*Math.PI/180; const dla=r(b.lat-a.lat),dlo=r(b.lng-a.lng);
  const s=Math.sin(dla/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dlo/2)**2; return 2*R*Math.asin(Math.sqrt(s)); }
function vibrate(p){ if(navigator.vibrate){ try{navigator.vibrate(p);}catch(e){} } }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1100); }

let segs=[], stns=[], showStations=true;

function buildSample(){
  segs=[]; stns=[]; showStations=true;
  const seen=new Map(); let sid=0;
  LINES.forEach(line=>{
    const L=line.stations, last=line.loop?L.length:L.length-1;
    L.forEach(st=>{ const key=st[0]; if(!seen.has(key)){ seen.set(key,sid);
      stns.push({id:sid, name:st[0], lat:st[1], lng:st[2], st:0, p:px(st[2],st[1])}); sid++; } });
    for(let i=0;i<last;i++){ const a=L[i], b=L[(i+1)%L.length];
      const ax=px(a[2],a[1]), bx=px(b[2],b[1]);
      segs.push({ id:segs.length, pts:[ax,bx], on:false, km:hav({lat:a[1],lng:a[2]},{lat:b[1],lng:b[2]}) }); }
  });
}

function buildFromGeoJSON(gj){
  segs=[]; stns=[]; showStations=false;
  const feats = gj.type==='FeatureCollection'?gj.features:(gj.type==='Feature'?[gj]:[]);
  const add=coords=>{ if(coords.length<2) return; const pts=coords.map(c=>px(c[0],c[1]));
    let km=0; for(let i=0;i<coords.length-1;i++) km+=hav({lng:coords[i][0],lat:coords[i][1]},{lng:coords[i+1][0],lat:coords[i+1][1]});
    segs.push({ id:segs.length, pts, on:false, km }); };
  feats.forEach(f=>{ const g=f.geometry; if(!g) return;
    if(g.type==='LineString') add(g.coordinates);
    else if(g.type==='MultiLineString') g.coordinates.forEach(add); });
}

function path(pts){ return 'M'+pts.map(p=>p[0].toFixed(5)+' '+p[1].toFixed(5)).join(' L'); }

function render(){
  gHit.innerHTML=gSeg.innerHTML=gStn.innerHTML=gLbl.innerHTML='';
  segs.forEach(s=>{
    gSeg.appendChild(mk('path',{d:path(s.pts), class:'seg'+(s.on?' on':''), 'data-seg':s.id}));
    gHit.appendChild(mk('path',{d:path(s.pts), class:'hit', 'data-seg':s.id}));
  });
  if(showStations) stns.forEach(s=>{
    gStn.appendChild(mk('circle',{cx:s.p[0], cy:s.p[1], r:0.004, class:'stn'+stCls(s.st), 'data-stn':s.id}));
    gLbl.appendChild(Object.assign(mk('text',{x:s.p[0], y:s.p[1]-0.006, 'text-anchor':'middle', class:'lbl'}),{textContent:s.name}));
  });
  document.getElementById('segT').textContent=segs.length;
  document.getElementById('stnT').textContent=showStations?stns.length:0;
  applyScale(); update();
}
const stCls=s=>['',' pass',' off',' stay'][s];

// ===== ビューボックス（パン・ズーム） =====
let vb={x:0,y:0,w:1,h:1};
function fit(){
  const xs=[], ys=[]; segs.forEach(s=>s.pts.forEach(p=>{xs.push(p[0]); ys.push(p[1]);}));
  if(!xs.length){ return; }
  const minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys);
  const pad=(maxx-minx||0.02)*0.12;
  let w=(maxx-minx)+pad*2, h=(maxy-miny)+pad*2;
  const ar=svg.clientWidth/svg.clientHeight;
  if(w/h<ar){ const nw=h*ar; vb={x:minx-pad-(nw-w)/2, y:miny-pad, w:nw, h}; }
  else { const nh=w/ar; vb={x:minx-pad, y:miny-pad-(nh-h)/2, w, h:nh}; }
  applyScale();
}
function applyScale(){
  svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  const s = vb.w / svg.clientWidth;             // ユーザー単位/画面px
  gLbl.setAttribute('font-size', 11*s);
  const showLbl = s < 0.00018;                  // 拡大時のみ駅名
  gLbl.style.display = (showStations && showLbl)?'':'none';
  const r = 3.4*s;
  gStn.querySelectorAll('circle').forEach(c=> c.setAttribute('r', r));
}

// ===== 入力（タップ判定 + パン + ピンチ） =====
const ptrs=new Map(); let moved=false, startT=0, panLast=null, pinchD=0;
function toUser(cx,cy){ const r=svg.getBoundingClientRect();
  return { x: vb.x + (cx-r.left)/r.width*vb.w, y: vb.y + (cy-r.top)/r.height*vb.h }; }
svg.addEventListener('pointerdown', e=>{ svg.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); moved=false; startT=Date.now();
  if(ptrs.size===1){ panLast={x:e.clientX,y:e.clientY}; }
  else if(ptrs.size===2){ const p=[...ptrs.values()]; pinchD=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y); }
});
svg.addEventListener('pointermove', e=>{
  if(!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1 && panLast){
    const dx=e.clientX-panLast.x, dy=e.clientY-panLast.y;
    if(Math.abs(dx)+Math.abs(dy)>4) moved=true;
    const r=svg.getBoundingClientRect();
    vb.x-=dx/r.width*vb.w; vb.y-=dy/r.height*vb.h; panLast={x:e.clientX,y:e.clientY}; applyScale();
  } else if(ptrs.size===2){
    moved=true; const p=[...ptrs.values()]; const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
    if(pinchD){ const mid=toUser((p[0].x+p[1].x)/2,(p[0].y+p[1].y)/2); const k=pinchD/d;
      zoomAt(mid,k); } pinchD=d;
  }
});
function endPtr(e){ const wasTap = ptrs.size===1 && !moved && (Date.now()-startT)<350;
  ptrs.delete(e.pointerId); panLast=null; pinchD=0;
  if(wasTap) handleTap(e.clientX,e.clientY);
}
svg.addEventListener('pointerup', endPtr);
svg.addEventListener('pointercancel', e=>{ ptrs.delete(e.pointerId); panLast=null; pinchD=0; });
function zoomAt(userPt,k){ k=Math.max(0.2,Math.min(5,k));
  const nw=Math.max(0.0008,Math.min(40, vb.w*k)), nh=nw*(vb.h/vb.w);
  vb.x=userPt.x-(userPt.x-vb.x)*(nw/vb.w); vb.y=userPt.y-(userPt.y-vb.y)*(nh/vb.h); vb.w=nw; vb.h=nh; applyScale(); }
svg.addEventListener('wheel', e=>{ e.preventDefault(); zoomAt(toUser(e.clientX,e.clientY), e.deltaY>0?1.15:0.87); }, {passive:false});

function handleTap(cx,cy){
  const el=document.elementFromPoint(cx,cy); if(!el) return;
  const stn=el.getAttribute('data-stn');
  if(stn!=null){ const s=stns[+stn]; s.st=(s.st+1)%4;
    el.setAttribute('class','stn'+stCls(s.st));
    vibrate(s.st===3?[25,40,25]:(s.st===0?15:30));
    toast(s.name+'：'+['未訪問','通過','下車','泊まった'][s.st]); update(); return; }
  const seg=el.getAttribute('data-seg');
  if(seg!=null){ const s=segs[+seg]; s.on=!s.on;
    gSeg.querySelector(`[data-seg="${seg}"]`).setAttribute('class','seg'+(s.on?' on':''));
    vibrate(s.on?35:18); update(s.on); }
}

function update(milestone){
  const n=segs.filter(s=>s.on).length;
  const km=Math.round(segs.reduce((a,s)=>a+(s.on?s.km:0),0));
  const rate=segs.length?Math.round(n/segs.length*100):0;
  const stn=showStations?stns.filter(s=>s.st>0).length:0;
  const rEl=document.getElementById('rate'); rEl.innerHTML=rate+'<small>%</small>';
  document.getElementById('bar').style.width=rate+'%';
  document.getElementById('segN').textContent=n; document.getElementById('km').textContent=km;
  document.getElementById('stnN').textContent=stn;
  rEl.classList.remove('pop'); void rEl.offsetWidth; rEl.classList.add('pop');
  if(milestone && rate>0 && rate%25===0) toast('🎉 '+rate+'% 達成！');
}

document.getElementById('reset').addEventListener('click',()=>{
  segs.forEach(s=>s.on=false); stns.forEach(s=>s.st=0); render(); toast('リセットしました'); });
document.getElementById('fit').addEventListener('click', fit);
function loadText(txt){ try{ buildFromGeoJSON(JSON.parse(txt)); render(); fit();
  toast('実データ読込: '+segs.length+'区間'); }catch(e){ toast('GeoJSON解析に失敗'); } }
document.getElementById('file').addEventListener('change',e=>{ const f=e.target.files[0]; if(!f)return;
  const r=new FileReader(); r.onload=()=>loadText(r.result); r.readAsText(f); });
const drop=document.getElementById('drop');
['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('show');}));
document.addEventListener('dragleave',e=>{ if(e.relatedTarget===null) drop.classList.remove('show'); });
document.addEventListener('drop',e=>{ e.preventDefault(); drop.classList.remove('show');
  const f=e.dataTransfer.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>loadText(r.result); r.readAsText(f); });

window.addEventListener('resize', applyScale);
buildSample(); render(); fit();
</script>
</body>
</html>
