<!DOCTYPE html>
<html lang="ja">

<title>乗りつぶしアトラス — プロトタイプ</title>
<style>
  :root{
    --bg:#e8eef0; --paper:#f3f6f7;
    --off:#9aa7b4; --on:#1fb866; --on2:#16a05a;
    --pass:#9aa7b4; --get:#1fb866; --stay:#f5a623;
    --ink:#37454f; --muted:#7b8794; --pref:#a9b6c2; --onsen:#e2622e; --spot:#3b82c4;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; overflow:hidden; background:var(--bg);
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif; color:var(--ink); }
  #wrap{ position:absolute; inset:0; }
  svg{ width:100%; height:100%; display:block; background:var(--paper); touch-action:none; }
  .seg{ fill:none; stroke-width:1.3; stroke-linecap:round; stroke-linejoin:round;
    vector-effect:non-scaling-stroke; pointer-events:stroke; cursor:pointer; }
  .seg.on{ stroke:var(--on)!important; stroke-width:4; }
  .stn{ fill:#fff; stroke:#5b6b7a; stroke-width:1.6; vector-effect:non-scaling-stroke; cursor:pointer; }
  .stn.pass{ fill:var(--pass); stroke:var(--pass); }
  .stn.off{ fill:var(--get); stroke:var(--on2); }
  .stn.stay{ fill:var(--stay); stroke:#c77f10; }
  .poi{ vector-effect:non-scaling-stroke; }
  .border{ fill:none; stroke:#8fa0b0; stroke-width:1.2; stroke-linejoin:round; vector-effect:non-scaling-stroke; pointer-events:none; }
  text{ paint-order:stroke; stroke:var(--paper); stroke-width:2.6; stroke-linejoin:round;
    vector-effect:non-scaling-stroke; }
  .lbl{ fill:var(--ink); font-weight:600; pointer-events:none; }
  .linelbl{ font-weight:800; pointer-events:none; }
  .preflbl{ fill:var(--pref); font-weight:800; letter-spacing:.06em; pointer-events:none; }
  .poilbl{ fill:#5a6b59; font-weight:700; pointer-events:none; }
  .hud{ position:absolute; top:54px; left:10px; right:10px; z-index:2; display:flex; gap:8px;
    background:rgba(255,255,255,.86); border-radius:14px; padding:9px 10px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
  .hud .cell{ flex:1; text-align:center; } .hud .label{ font-size:10px; color:var(--muted); }
  .hud .val{ font-size:18px; font-weight:800; font-variant-numeric:tabular-nums; }
  .hud .val small{ font-size:11px; color:var(--muted); font-weight:600; }
  .bar{ position:absolute; left:0; bottom:0; height:3px; background:var(--on); width:0%; border-radius:2px; transition:width .5s cubic-bezier(.2,.8,.2,1); }
  .pop{ animation:pop .35s ease; } @keyframes pop{ 0%{transform:scale(1)} 40%{transform:scale(1.2); color:var(--on)} 100%{transform:scale(1)} }
  .panel{ position:absolute; left:10px; right:10px; bottom:10px; z-index:2;
    background:rgba(255,255,255,.9); border-radius:14px; padding:9px 11px; box-shadow:0 2px 10px rgba(0,0,0,.08); font-size:12px; }
  .panel .row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .panel button,.fake{ background:#f3f6f7; color:var(--ink); border:1px solid #cdd6dd; border-radius:18px; padding:7px 12px; font-size:12px; font-weight:700; cursor:pointer; }
  .panel input#q{ flex:1; min-width:140px; padding:7px 11px; border:1px solid #cdd6dd; border-radius:18px; font-size:13px; outline:none; }
  .panel input#q:focus{ border-color:var(--on); }
  .legend{ display:flex; gap:12px; flex-wrap:wrap; margin-top:7px; color:var(--muted); }
  .legend i{ width:10px; height:10px; border-radius:50%; display:inline-block; vertical-align:middle; margin-right:4px; }
  .hint{ color:var(--muted); margin-top:6px; line-height:1.5; }
  .navtoggle{ position:absolute; top:10px; left:10px; z-index:6; display:inline-flex; background:#fff; border:1px solid #cdd6dd; border-radius:18px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,.12); }
  .navtoggle a{ text-decoration:none; color:#37454f; font-size:12px; font-weight:800; padding:7px 13px; }
  .navtoggle a.active{ background:var(--on); color:#fff; }
  .zoom{ position:absolute; right:12px; bottom:128px; z-index:3; display:flex; flex-direction:column; gap:7px; }
  .zoom button{ width:44px; height:44px; border-radius:50%; border:1px solid #cdd6dd; background:rgba(255,255,255,.94);
    font-size:24px; font-weight:700; color:var(--ink); box-shadow:0 2px 8px rgba(0,0,0,.14); cursor:pointer; line-height:1; padding:0; }
  .zoom button:active{ background:#e9eef0; }
  .tip{ position:absolute; z-index:6; background:rgba(20,28,40,.92); color:#fff; font-size:12px; font-weight:700;
    padding:5px 9px; border-radius:8px; pointer-events:none; opacity:0; transition:opacity .12s; white-space:nowrap; max-width:60vw; }
  .tip.show{ opacity:1; }
  .toast{ position:absolute; left:50%; bottom:96px; transform:translateX(-50%) translateY(15px); z-index:3;
    background:var(--on); color:#fff; font-weight:700; padding:8px 16px; border-radius:24px; font-size:13px; opacity:0; transition:all .3s; pointer-events:none; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .drop{ position:absolute; inset:0; z-index:5; display:none; align-items:center; justify-content:center;
    background:rgba(31,184,102,.15); border:3px dashed var(--on); color:var(--on2); font-size:18px; font-weight:800; }
  .drop.show{ display:flex; }
</style>

<div id="wrap">

</div>

<div class="panel">

</div>

<div class="zoom">

</div>

<div class="tip" id="tip"></div>

['草津温泉',36.62,138.59,'o'],['箱根湯本',35.23,139.10,'o'],['熱海温泉',35.10,139.07,'o'],['鬼怒川温泉',36.82,139.70,'o'],

['鋸山',35.16,139.82,'s'],['銚子',35.73,140.83,'s'],['筑波山',36.22,140.10,'s'],['中禅寺湖',36.73,139.48,'s'],
['上高地',36.25,137.63,'s'],['奈良公園',34.685,135.84,'s'],['宮島',34.30,132.32,'s'],['伊勢神宮',34.46,136.73,'s'],
['城崎温泉',35.62,134.81,'o'],['黒川温泉',33.09,131.14,'o'],['銀山温泉',38.58,140.53,'o'],['乳頭温泉',39.79,140.80,'o'],
['下呂温泉',35.81,137.24,'o'],['和倉温泉',37.08,136.94,'o'],['指宿温泉',31.22,130.63,'o'],['蔵王温泉',38.17,140.40,'o']];

const LAT0=35.7, KX=Math.cos(LAT0*Math.PI/180);
const px=(lng,lat)=>[ lng*KX, -lat ];
const svg=document.getElementById('svg');
const VW=()=>window.innerWidth||document.documentElement.clientWidth||800;
const VH=()=>window.innerHeight||document.documentElement.clientHeight||600;
function sizeSvg(){ svg.style.width=VW()+'px'; svg.style.height=VH()+'px'; }
const gBorder=g('gBorder'),gPref=g('gPref'),gSeg=g('gSeg'),gLine=g('gLine'),gPoi=g('gPoi'),gPoiLbl=g('gPoiLbl'),gStn=g('gStn'),gLbl=g('gLbl');
function g(id){return document.getElementById(id);}
const NS='http://www.w3.org/2000/svg';
const mk=(t,a,txt)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]); if(txt!=null)e.textContent=txt; return e;};
function hav(a,b){ const R=6371,r=x=>x*Math.PI/180; const dla=r(b.lat-a.lat),dlo=r(b.lng-a.lng);
  const s=Math.sin(dla/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dlo/2)**2; return 2*R*Math.asin(Math.sqrt(s)); }
function vibrate(p){ if(navigator.vibrate){ try{navigator.vibrate(p);}catch(e){} } }
function toast(m){ const t=g('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1100); }

// ===== 自動保存・復元(IndexedDB)：読み込んだデータと塗った状態をブラウザに記憶 =====
const store={rail:null,borders:null,spots:null,stations:null,paint:{seg:[],stn:{}}};
function idb(){ return new Promise((res,rej)=>{ if(!('indexedDB' in window)||!window.indexedDB) return rej();
  const o=indexedDB.open('atlasStore',1);
  o.onupgradeneeded=()=>{ if(!o.result.objectStoreNames.contains('kv')) o.result.createObjectStore('kv'); };
  o.onsuccess=()=>res(o.result); o.onerror=()=>rej(); }); }
async function idbSet(k,v){ try{ const db=await idb(); await new Promise(r=>{ const tx=db.transaction('kv','readwrite'); tx.objectStore('kv').put(v,k); tx.oncomplete=r; tx.onerror=r; }); }catch(e){} }
async function idbGet(k){ try{ const db=await idb(); return await new Promise(r=>{ const tx=db.transaction('kv','readonly'); const rq=tx.objectStore('kv').get(k); rq.onsuccess=()=>r(rq.result); rq.onerror=()=>r(null); }); }catch(e){ return null; } }
let saveT; function saveState(){ clearTimeout(saveT); saveT=setTimeout(()=>idbSet('state',store),300); }
async function restore(){ const st=await idbGet('state'); if(!st||(!st.rail&&!st.borders&&!st.spots&&!st.stations)) return;
  if(st.rail) setRail(st.rail.features); if(st.borders) setBorders(st.borders.features); if(st.spots) setSpots(st.spots.features);
  if(st.stations) setStations(st.stations.features);
  store.rail=st.rail||null; store.borders=st.borders||null; store.spots=st.spots||null; store.stations=st.stations||null; store.paint=st.paint||{seg:[],stn:{}};
  (store.paint.seg||[]).forEach(id=>{ if(segs[id]) segs[id].on=true; });
  for(const k in (store.paint.stn||{})){ if(stns[k]) stns[k].st=store.paint.stn[k]; }
  render(); if(segs.length) fitRail(); toast('前回のデータを復元しました'); }

let segs=[], stns=[], lineLbls=[], borders=[], showStations=true;
let spots=POIS.map(p=>({name:p[0],lat:p[1],lng:p[2],type:p[3]}));

function buildSample(){
  segs=[]; stns=[]; lineLbls=[]; showStations=true; const seen=new Map(); let sid=0;
  LINES.forEach(line=>{ const L=line.stations, last=line.loop?L.length:L.length-1;
    L.forEach(st=>{ if(!seen.has(st[0])){ seen.set(st[0],sid);
      stns.push({id:sid,name:st[0],lat:st[1],lng:st[2],st:0,p:px(st[2],st[1])}); sid++; } });
    for(let i=0;i<last;i++){ const a=L[i], b=L[(i+1)%L.length];
      segs.push({ id:segs.length, pts:[px(a[2],a[1]),px(b[2],b[1])], on:false, color:line.color, name:line.name,
        km:hav({lat:a[1],lng:a[2]},{lat:b[1],lng:b[2]}) }); }
    let sx=0,sy=0; L.forEach(s=>{sx+=s[2];sy+=s[1];});
    lineLbls.push({name:line.name, color:line.color, p:px(sx/L.length, sy/L.length)});
  });
}
// 種類別ローダ：線=路線 / 面=県境 / 点=スポット
function setRail(lineFeats){
  segs=[]; stns=[]; lineLbls=[]; showStations=false; const seenN=new Set();
  const add=(c,color,name)=>{ if(c.length<2)return; const pts=c.map(p=>px(p[0],p[1])); let km=0;
    for(let i=0;i<c.length-1;i++) km+=hav({lng:c[i][0],lat:c[i][1]},{lng:c[i+1][0],lat:c[i+1][1]});
    segs.push({id:segs.length,pts,on:false,km,color:color||'var(--off)',name:name||''}); };
  lineFeats.forEach(f=>{ const gm=f.geometry; if(!gm)return;
    const col=(f.properties&&f.properties.color)||null;
    const nm=(f.properties&&(f.properties.name||f.properties.N02_003||f.properties['路線名']))||'';
    if(gm.type==='LineString') add(gm.coordinates,col,nm); else if(gm.type==='MultiLineString') gm.coordinates.forEach(c=>add(c,col,nm));
    if(nm && !seenN.has(nm)){ seenN.add(nm);
      const cs=gm.type==='LineString'?gm.coordinates:(gm.type==='MultiLineString'?gm.coordinates[0]:null);
      if(cs&&cs.length){ const m=cs[Math.floor(cs.length/2)]; lineLbls.push({name:nm,color:col||'#5b6b7a',p:px(m[0],m[1])}); } }
  });
}
function setBorders(polyFeats){
  borders=[];
  polyFeats.forEach(f=>{ const gm=f.geometry; if(!gm)return;
    const polys = gm.type==='Polygon'?[gm.coordinates] : gm.type==='MultiPolygon'?gm.coordinates : [];
    polys.forEach(rings=> rings.forEach(ring=>{ if(ring.length<3)return;
      borders.push('M'+ring.map(c=>{const p=px(c[0],c[1]);return p[0].toFixed(5)+' '+p[1].toFixed(5);}).join(' L')+'Z'); }));
  });
}
function setStations(pointFeats){
  const gk=p=>p.N02_005g||p.N02_005c||p.N02_005||p.name||'';
  const cnt={}; pointFeats.forEach(f=>{ const k=gk(f.properties||{}); if(k) cnt[k]=(cnt[k]||0)+1; });  // 路線数=重要度
  const seen=new Set(), arr=[];
  pointFeats.forEach(f=>{ if(!f.geometry||f.geometry.type!=='Point')return; const c=f.geometry.coordinates, p=f.properties||{};
    const name=p.N02_005||p.name||p['駅名']||''; if(!name)return;
    const key=p.N02_005g||p.N02_005c||(name+'@'+c[0].toFixed(2)+','+c[1].toFixed(2));
    if(seen.has(key))return; seen.add(key);
    arr.push({name, lat:c[1], lng:c[0], st:0, p:px(c[0],c[1]), imp:cnt[gk(p)]||1}); });
  arr.forEach((s,i)=>s.id=i); stns=arr; showStations=stns.length>0;
}
function pointsAreStations(pts){ return pts.some(f=>f.properties&&(f.properties.N02_005||f.properties.N02_005g||f.properties['駅名'])); }
function setSpots(pointFeats){
  spots = pointFeats.map(f=>{ const c=f.geometry.coordinates, p=f.properties||{};
    const name=p.name||p.NAME||p['名称']||p['名前']||''; let t=p.type||p.category||'';
    t=(t==='o'||/温泉|湯/.test(name))?'o':'s'; return {name, lat:c[1], lng:c[0], type:t}; }).filter(s=>s.name);
}
function routeGeoJSON(gj){
  const feats = gj.type==='FeatureCollection'?gj.features:(gj.type==='Feature'?[gj]:[]);
  const lines=feats.filter(f=>f.geometry&&/LineString/.test(f.geometry.type));
  const polys=feats.filter(f=>f.geometry&&/Polygon/.test(f.geometry.type));
  const pts  =feats.filter(f=>f.geometry&&f.geometry.type==='Point');
  const msg=[];
  if(lines.length){ setRail(lines); store.rail={type:'FeatureCollection',features:lines}; store.paint={seg:[],stn:{}}; msg.push(segs.length+'区間'); }
  if(polys.length){ setBorders(polys); store.borders={type:'FeatureCollection',features:polys}; msg.push(borders.length+'境界'); }
  if(pts.length){ if(pointsAreStations(pts)){ setStations(pts); store.stations={type:'FeatureCollection',features:pts}; msg.push(stns.length+'駅'); }
    else { setSpots(pts); store.spots={type:'FeatureCollection',features:pts}; msg.push(spots.length+'スポット'); } }
  render(); if(lines.length) fitRail(); saveState();
  toast('読込: '+(msg.join(' / ')||'対象なし'));
}
const pathd=pts=>'M'+pts.map(p=>p[0].toFixed(5)+' '+p[1].toFixed(5)).join(' L');
const stCls=s=>['',' pass',' off',' stay'][s];

function render(){
  [gBorder,gPref,gSeg,gLine,gPoi,gPoiLbl,gStn,gLbl].forEach(x=>x.innerHTML='');
  // 県境(面)
  borders.forEach(d=> gBorder.appendChild(mk('path',{d,class:'border'})));
  // 県名
  PREFS.forEach(p=>{ const c=px(p[2],p[1]); gPref.appendChild(mk('text',{x:c[0],y:c[1],'text-anchor':'middle',class:'preflbl'},p[0])); });
  // 温泉・観光
  spots.forEach(p=>{ const c=px(p.lng,p.lat); const col=p.type==='o'?'var(--onsen)':'var(--spot)';
    gPoi.appendChild(mk('circle',{cx:c[0],cy:c[1],r:0.003,fill:col,stroke:'#fff','stroke-width':1.4,class:'poi'}));
    gPoiLbl.appendChild(mk('text',{x:c[0],y:c[1]-0.006,'text-anchor':'middle',class:'poilbl'},(p.type==='o'?'♨':'')+p.name)); });
  // 鉄道
  segs.forEach(s=>{ gSeg.appendChild(mk('path',{d:pathd(s.pts),class:'seg'+(s.on?' on':''),stroke:s.color||'var(--off)','data-seg':s.id})); });
  // 路線名
  lineLbls.forEach(l=> gLine.appendChild(mk('text',{x:l.p[0],y:l.p[1],'text-anchor':'middle',class:'linelbl',fill:l.color},l.name)));
  renderStations();
  g('segT').textContent=segs.length; g('stnT').textContent=showStations?stns.length:0;
  applyScale(); update();
}

// 駅は数が多いので「画面に映る範囲だけ」描く(間引き)
function renderStations(){
  gStn.innerHTML=''; gLbl.innerHTML='';
  if(!showStations) return;
  const s=vb.w/VW(); if(s>0.025) return;
  const m=vb.w*0.1, x0=vb.x-m, x1=vb.x+vb.w+m, y0=vb.y-m, y1=vb.y+vb.h+m;
  const r=4.8*s; let n=0;
  for(const st of stns){ const p=st.p; if(p[0]<x0||p[0]>x1||p[1]<y0||p[1]>y1) continue;
    const imp=st.imp||1;                              // 重要度(路線数)が高いほど早く(引いた状態で)表示
    const dotMax = imp>=6?0.022 : imp>=4?0.005 : imp>=3?0.0028 : imp>=2?0.0011 : 0.00055;
    if(s>dotMax) continue;
    gStn.appendChild(mk('circle',{cx:p[0],cy:p[1],r,class:'stn'+stCls(st.st),'data-stn':st.id}));
    gLbl.appendChild(mk('text',{x:p[0],y:p[1]-0.006,'text-anchor':'middle',class:'lbl'},st.name));  // 丸と名前を連動
    if(++n>1500) break; }
}
let stnT2; function scheduleStations(){ clearTimeout(stnT2); stnT2=setTimeout(renderStations,90); }

// ===== ビューボックス =====
let vb={x:0,y:0,w:1,h:1};
function fitTo(xs,ys){ if(!xs.length)return;
  const minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys);
  const pad=((maxx-minx)||0.02)*0.12; let w=(maxx-minx)+pad*2,h=(maxy-miny)+pad*2;
  const ar=VW()/VH();
  if(w/h<ar){ const nw=h*ar; vb={x:minx-pad-(nw-w)/2,y:miny-pad,w:nw,h}; }
  else { const nh=w/ar; vb={x:minx-pad,y:miny-pad-(nh-h)/2,w,h:nh}; } applyScale();
}
function fitRail(){ const xs=[],ys=[]; segs.forEach(s=>s.pts.forEach(p=>{xs.push(p[0]);ys.push(p[1]);})); fitTo(xs,ys); }
function fitJapan(){ const xs=[],ys=[]; PREFS.forEach(p=>{const c=px(p[2],p[1]);xs.push(c[0]);ys.push(c[1]);}); fitTo(xs,ys); }
function applyScale(){
  svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  const s=vb.w/VW();
  gLbl.setAttribute('font-size',10*s); gPoiLbl.setAttribute('font-size',9.5*s);
  gPref.setAttribute('font-size',10.5*s); gLine.setAttribute('font-size',11*s);
  gLbl.style.display   =(showStations && s<=0.025)?'':'none';   // 駅名はrenderStationsが駅ごとに制御
  gLine.style.display  =(s<=0.00075 && s>=0.00009)?'':'none';
  gPoiLbl.style.display=(s<=0.00045)?'':'none';
  gPoi.style.display   =(s<=0.0011)?'':'none';
  gPref.style.display  =(s>=0.00011)?'':'none';
  const rs=4.8*s; gStn.querySelectorAll('circle').forEach(c=>c.setAttribute('r',rs));
  const rp=7*s; gPoi.querySelectorAll('circle').forEach(c=>c.setAttribute('r',rp));
  scheduleStations();
}

// パン/ズーム時の再描画をフレーム単位に間引く(重さ対策)
let rafPending=false;
function scheduleScale(){ if(rafPending)return; rafPending=true; requestAnimationFrame(()=>{ rafPending=false; applyScale(); }); }

// ===== 入力 =====
const ptrs=new Map(); let moved=false,startT=0,panLast=null,pinchD=0;
function toUser(cx,cy){ const r=svg.getBoundingClientRect(); return {x:vb.x+(cx-r.left)/r.width*vb.w, y:vb.y+(cy-r.top)/r.height*vb.h}; }
svg.addEventListener('pointerdown',e=>{ svg.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); moved=false; startT=Date.now();
  if(ptrs.size===1) panLast={x:e.clientX,y:e.clientY}; else if(ptrs.size===2){ const p=[...ptrs.values()]; pinchD=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y); } });
svg.addEventListener('pointermove',e=>{ if(!ptrs.has(e.pointerId))return; ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1&&panLast){ const dx=e.clientX-panLast.x,dy=e.clientY-panLast.y; if(Math.abs(dx)+Math.abs(dy)>4)moved=true;
    const r=svg.getBoundingClientRect(); vb.x-=dx/r.width*vb.w; vb.y-=dy/r.height*vb.h; panLast={x:e.clientX,y:e.clientY}; scheduleScale(); }
  else if(ptrs.size===2){ moved=true; const p=[...ptrs.values()]; const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
    if(pinchD){ zoomAt(toUser((p[0].x+p[1].x)/2,(p[0].y+p[1].y)/2), pinchD/d); } pinchD=d; } });
function endPtr(e){ const tap=ptrs.size===1&&!moved&&(Date.now()-startT)<350; ptrs.delete(e.pointerId); panLast=null; pinchD=0; if(tap) handleTap(e.clientX,e.clientY); }
svg.addEventListener('pointerup',endPtr);
svg.addEventListener('pointercancel',e=>{ ptrs.delete(e.pointerId); panLast=null; pinchD=0; });
function zoomAt(u,k){ k=Math.max(0.2,Math.min(5,k)); const nw=Math.max(0.0006,Math.min(60,vb.w*k)),nh=nw*(vb.h/vb.w);
  vb.x=u.x-(u.x-vb.x)*(nw/vb.w); vb.y=u.y-(u.y-vb.y)*(nh/vb.h); vb.w=nw; vb.h=nh; scheduleScale(); }
svg.addEventListener('wheel',e=>{ e.preventDefault(); zoomAt(toUser(e.clientX,e.clientY), e.deltaY>0?1.15:0.87); },{passive:false});

// 路線ホバーで路線名ツールチップ
const tip=g('tip');
function showTip(t,x,y){ tip.textContent=t; tip.style.left=(x+12)+'px'; tip.style.top=(y+14)+'px'; tip.classList.add('show'); }
function hideTip(){ tip.classList.remove('show'); }
svg.addEventListener('mousemove', e=>{ if(ptrs.size){ hideTip(); return; }
  const t=e.target, sg=t&&t.getAttribute&&t.getAttribute('data-seg');
  if(sg!=null){ const s=segs[+sg]; if(s&&s.name){ showTip(s.name, e.clientX, e.clientY); return; } }
  hideTip(); });
svg.addEventListener('mouseleave', hideTip);
svg.addEventListener('pointerdown', hideTip);

// 細い線でも当てやすいよう、近傍を少しずつ探る(当たり判定レイヤー廃止の代替)
function pick(cx,cy){
  const tries=[[0,0],[0,-5],[0,5],[-5,0],[5,0],[-4,-4],[4,4],[-4,4],[4,-4],[0,-10],[0,10],[-10,0],[10,0]];
  for(const [dx,dy] of tries){ const el=document.elementFromPoint(cx+dx,cy+dy); if(!el||!el.getAttribute)continue;
    const st=el.getAttribute('data-stn'); if(st!=null)return {stn:st};
    const sg=el.getAttribute('data-seg'); if(sg!=null)return {seg:sg}; }
  return null;
}
function handleTap(cx,cy){ const hit=pick(cx,cy); if(!hit)return;
  if(hit.stn!=null){ const s=stns[+hit.stn]; s.st=(s.st+1)%4;
    gStn.querySelector(`[data-stn="${hit.stn}"]`).setAttribute('class','stn'+stCls(s.st));
    store.paint.stn[hit.stn]=s.st; saveState();
    vibrate(s.st===3?[25,40,25]:(s.st===0?15:30)); toast(s.name+'：'+['未訪問','通過','下車','泊まった'][s.st]); update(); return; }
  if(hit.seg!=null){ const s=segs[+hit.seg]; s.on=!s.on;
    gSeg.querySelector(`[data-seg="${hit.seg}"]`).setAttribute('class','seg'+(s.on?' on':''));
    if(s.on) store.paint.seg.push(+hit.seg); else store.paint.seg=store.paint.seg.filter(x=>x!==+hit.seg);
    saveState(); vibrate(s.on?35:18); update(s.on); } }

function update(milestone){
  const n=segs.filter(s=>s.on).length, km=Math.round(segs.reduce((a,s)=>a+(s.on?s.km:0),0));
  const rate=segs.length?Math.round(n/segs.length*100):0, stn=showStations?stns.filter(s=>s.st>0).length:0;
  const rEl=g('rate'); rEl.innerHTML=rate+'<small>%</small>'; g('bar').style.width=rate+'%';
  g('segN').textContent=n; g('km').textContent=km; g('stnN').textContent=stn;
  rEl.classList.remove('pop'); void rEl.offsetWidth; rEl.classList.add('pop');
  if(milestone&&rate>0&&rate%25===0) toast('🎉 '+rate+'% 達成！');
}

g('home').addEventListener('click',fitRail);   // デフォルト表示(全国)に戻る
g('clear').addEventListener('click',()=>{ segs.forEach(s=>s.on=false); stns.forEach(s=>s.st=0); store.paint={seg:[],stn:{}}; render(); saveState(); toast('塗りを消去しました'); });
// 駅名・路線名 検索
function goToPoint(p,w){ w=w||0.22; const h=w*(VH()/VW()); vb={x:p[0]-w/2,y:p[1]-h/2,w,h}; applyScale(); renderStations(); }
function fitLine(name){ const xs=[],ys=[]; segs.forEach(s=>{ if(s.name===name) s.pts.forEach(p=>{xs.push(p[0]);ys.push(p[1]);}); }); if(xs.length) fitTo(xs,ys); }
function searchGo(){ const q=g('q').value.trim(); if(!q) return;
  const findStn=()=> stns.find(s=>s.name===q) || stns.find(s=>s.name.includes(q));
  const findLine=()=>{ const l=lineLbls.find(x=>x.name===q)||lineLbls.find(x=>x.name.includes(q)); if(l)return l.name;
    const s=segs.find(x=>x.name&&(x.name===q||x.name.includes(q))); return s?s.name:null; };
  const lineFirst=/線/.test(q);
  const st=findStn(), ln=findLine();
  if(lineFirst && ln){ fitLine(ln); toast('路線: '+ln); }
  else if(st){ goToPoint(st.p); toast('駅: '+st.name); }
  else if(ln){ fitLine(ln); toast('路線: '+ln); }
  else toast('見つかりません: '+q); }
g('go').addEventListener('click',searchGo);
g('q').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); searchGo(); } });
function zoomCenter(k){ zoomAt(toUser(VW()/2, VH()/2), k); }
g('zin').addEventListener('click',()=>zoomCenter(0.7));
g('zout').addEventListener('click',()=>zoomCenter(1.43));
g('sample').addEventListener('click',()=>{ store.rail=store.borders=store.spots=null; store.paint={seg:[],stn:{}};
  borders=[]; spots=POIS.map(p=>({name:p[0],lat:p[1],lng:p[2],type:p[3]}));
  buildSample(); render(); fitRail(); idbSet('state',null); toast('サンプルに戻しました'); });
function loadText(t){ try{ routeGeoJSON(JSON.parse(t)); }catch(e){ toast('GeoJSON解析に失敗'); } }
g('file').addEventListener('change',e=>{ const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>loadText(r.result); r.readAsText(f); });
const drop=g('drop');
['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('show');}));
document.addEventListener('dragleave',e=>{ if(e.relatedTarget===null) drop.classList.remove('show'); });
document.addEventListener('drop',e=>{ e.preventDefault(); drop.classList.remove('show'); const f=e.dataTransfer.files[0]; if(!f)return;
  const r=new FileReader(); r.onload=()=>loadText(r.result); r.readAsText(f); });
// サイトに同梱されたデータをURLから自動取得(全デバイスで同じ地図に)
async function tryFetchText(names){ if(typeof fetch==='undefined') return null;
  for(const n of names){ try{ const r=await fetch(n,{cache:'no-cache'}); if(r&&r.ok) return await r.text(); }catch(e){} } return null; }
async function init(){
  let loaded=false;
  const railTxt=await tryFetchText(['rail-color.geojson','rail.geojson']);
  if(railTxt){ try{ const fc=JSON.parse(railTxt); const lines=(fc.features||[]).filter(f=>f.geometry&&/LineString/.test(f.geometry.type));
    if(lines.length){ setRail(lines); store.rail={type:'FeatureCollection',features:lines}; loaded=true; } }catch(e){} }
  const bordTxt=await tryFetchText(['borders.geojson','prefectures.geojson','japan.geojson','japan.geojson.txt']);
  if(bordTxt){ try{ const fc=JSON.parse(bordTxt); const polys=(fc.features||[]).filter(f=>f.geometry&&/Polygon/.test(f.geometry.type));
    if(polys.length){ setBorders(polys); store.borders={type:'FeatureCollection',features:polys}; loaded=true; } }catch(e){} }
  const stnTxt=await tryFetchText(['stations.geojson']);
  if(stnTxt){ try{ const fc=JSON.parse(stnTxt); const pts=(fc.features||[]).filter(f=>f.geometry&&f.geometry.type==='Point');
    if(pts.length){ setStations(pts); store.stations={type:'FeatureCollection',features:pts}; loaded=true; } }catch(e){} }
  if(loaded){
    const st=await idbGet('state');
    if(st&&st.paint){ store.paint=st.paint;
      (st.paint.seg||[]).forEach(id=>{ if(segs[id]) segs[id].on=true; });
      for(const k in (st.paint.stn||{})){ if(stns[k]) stns[k].st=st.paint.stn[k]; } }
    render(); if(segs.length) fitRail(); toast('地図を読み込みました');
  } else { restore(); }
}
function boot(){ sizeSvg(); buildSample(); render(); fitRail(); init(); }
if(document.readyState==='loading') window.addEventListener('DOMContentLoaded',boot); else boot();
window.addEventListener('load',()=>{ sizeSvg(); fitRail(); });   // 完全表示後に再フィット(Android対策)
window.addEventListener('resize',()=>{ sizeSvg(); applyScale(); });
window.addEventListener('orientationchange',()=>{ sizeSvg(); fitRail(); });
</script>
</body>
</html>
